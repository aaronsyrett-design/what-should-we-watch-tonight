name: Refresh lineups

# Every morning, pull the streaming lineup (data/universal.json) and the Angel Studios lineup
# (data/catalog.json) from TMDB. Where-to-watch data comes from JustWatch through TMDB.
# Needs a repository secret named TMDB_TOKEN (Settings > Secrets and variables > Actions).
on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC = 4 or 5 a.m. Mountain
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-lineup
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull the streaming lineup from TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/sync-universal.mjs
      - name: Pull the Angel lineup from TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/sync-catalog.mjs
      - name: Save it if anything changed
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Lineups unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh lineups from TMDB"
          git push
