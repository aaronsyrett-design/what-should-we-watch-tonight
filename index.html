<style>
/* Layout: one-column game screen, max 560px, marquee display type, bracket scrolls sideways in its own box */

/* ---------- synced lineup ----------
   data/catalog.json is refreshed daily from TMDB by .github/workflows/sync-lineup.yml.
   Hand-curated titles keep their mood tags and gain posters, keywords and missing details;
   new Angel titles join the deck with tags inferred from TMDB genres and keywords. */
const LINEUP = {loaded:false, added:0, notice:''};
async function loadLineup(){
  if(!/^https?:$/.test(location.protocol)) return;
  let doc; try{ const r=await fetch('data/catalog.json',{cache:'no-cache'}); if(!r.ok) return; doc=await r.json(); }catch{ return; }
  if(!doc||!Array.isArray(doc.titles)) return;
  const AGES=['all','kids','teen','adult'], LENS=['short','movie','epic'];
  doc.titles.forEach(x=>{
    if(!x||!x.id||!x.t) return;
    const have=BY_ID[x.id];
    if(have){
      if(x.poster) have.poster=x.poster;
      if(x.keywords) have.keywords=x.keywords;
      if(!have.cast.length&&x.cast) have.cast=x.cast.slice(0,4);
      if(have.unverified&&x.b){ have.b=x.b; delete have.unverified; }
      return;
    }
    if(!Array.isArray(x.tags)||!x.tags.length) return;
    const c={id:x.id,t:String(x.t),y:x.y||'',k:x.k||'Movie',age:AGES.includes(x.age)?x.age:'teen',g:Array.isArray(x.g)?x.g:['drama'],tags:x.tags,
      i:Math.max(1,Math.min(5,Number(x.i)||3)),len:LENS.includes(x.len)?x.len:'movie',cast:Array.isArray(x.cast)?x.cast.slice(0,4):[],
      b:x.b||'New on Angel.',poster:x.poster||null,keywords:x.keywords||[],synced:true};
    CATALOG.push(c); BY_ID[c.id]=c; LINEUP.added++;
  });
  LINEUP.loaded=true; LINEUP.notice=doc.notice||'';
  rankCache.clear();
  render();
}

/* ---------- local stand-in store (used when this view can't sync) ---------- */
function makeLocalDB(){
  const store=new Map(), subs=new Set(); let queued=false;
  const notify=()=>{ if(queued) return; queued=true; setTimeout(()=>{ queued=false; subs.forEach(f=>f()); },0); };
  const snap=p=>{ const d=store.get(p); return {id:p.split('/').pop(),exists:!!d,data:()=>d&&clone(d)}; };
  const docRef=p=>({path:p,id:p.split('/').pop(),
    get:async()=>snap(p), set:async d=>{store.set(p,clone(d));notify();},
    update:async d=>{const c=store.get(p); if(!c) throw {code:'invalid_argument',message:'missing'}; store.set(p,merge(clone(c),d)); notify();},
    delete:async()=>{store.delete(p);notify();},
    onSnapshot(fn){const f=()=>fn(snap(p)); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f);},
    collection:c=>colRef(p+'/'+c)});
  const colRef=cp=>({path:cp, doc:id=>docRef(cp+'/'+(id||rid())),
    onSnapshot(fn){const depth=cp.split('/').length+1; const f=()=>{const docs=[...store.keys()].filter(k=>k.startsWith(cp+'/')&&k.split('/').length===depth).sort().map(snap); fn({docs,size:docs.length,empty:!docs.length});}; subs.add(f); setTimeout(f,0); return ()=>subs.delete(f);}});
  return {doc:docRef, collection:colRef};
}

/* ---------- scoring ---------- */
function score(item, a){ return scoreParts(item,a).total; }
function scoreParts(item, a){
  const p={genre:0,want:0,vibe:0,feel:0,len:0,actor:0,taste:0,total:0};
  if(!a) return p;
  const tagW = t => { const i=item.tags.indexOf(t); return i<0?0:(i===0?1:.6); };   /* first tag is what the title is mostly about */
  p.genre = Math.min(2,item.g.filter(g=>(a.genres||[]).includes(g)).length)*2.5;
  p.want = 4*tagW(a.want);
  p.vibe = 1.2*(VIBE_TAGS[a.vibe]||[]).reduce((s,t)=>s+tagW(t),0);
  const r=VIBE_RANGE[a.vibe];
  if(r){ const off = item.i<r[0] ? r[0]-item.i : item.i>r[1] ? item.i-r[1] : 0; p.feel = off ? -1.8*off : 1; }
  if(a.want in WANT_AVOID && item.i>=WANT_AVOID[a.want]) p.feel -= 2;
  if (a.len==='short') p.len = item.len==='short'?2:(item.len==='epic'?-2:0);
  if (a.len==='movie') p.len = item.len==='movie'?1.5:(item.len==='short'?.5:-1);
  if (a.len==='any' && item.len==='epic') p.len=.5;
  const act=ACTORS[a.actor];
  if(act){ if(item.cast.includes(act.n)) p.actor+=3; p.actor += .8*act.tags.reduce((s,t)=>s+tagW(t),0); }
  p.taste = 0;
  [SNACKS[a.snack],DRINKS[a.drink],PLAYLISTS[a.playlist]].forEach(x=>{ if(x) p.taste += .6*x.tags.reduce((s,t)=>s+tagW(t),0); });
  p.total = p.genre+p.want+p.vibe+p.feel+p.len+p.actor+p.taste + (hash(item.id+(a.vibe||''))%100)/1000;
  return p;
}
function maxScore(a){ return ((a.genres||[]).length?5:0) + 4 + 1.2*2.2 + 1 + 2 + (ACTORS[a.actor]?3+.8*2.2:0) + (SNACKS[a.snack]?.6*1.8:0) + (PLAYLISTS[a.playlist]?.6*1.8:0) + (DRINKS[a.drink]?.6*1.8:0); }

/* ---------- room fit: picks that work for the whole room ----------
   Each person's fit is where a title lands in their own ranking of the lineup (1 = their top pick,
   0 = their last), so nobody counts more just because they answered more questions or feel strongly.
   The room score blends the average with the lowest fit ("least misery"): a title everyone likes
   beats one that half the room loves and the other half dreads. */
const DEALBREAK = .2;   /* bottom fifth of someone's list: they'd probably rather do the dishes */
const HAPPY = .6;
const tagWeight = (item,t) => { const i=item.tags?item.tags.indexOf(t):-1; return i<0?0:(i===0?1:.6); };
const rankCache = new Map();
function fitOf(item, a){
  if(!a||!item||!item.tags) return 0;
  const key=JSON.stringify(a);
  let sorted=rankCache.get(key);
  if(!sorted){ sorted=CATALOG.map(c=>score(c,a)).sort((x,y)=>x-y); if(rankCache.size>200) rankCache.clear(); rankCache.set(key,sorted); }
  const s=score(item,a); let below=0; while(below<sorted.length&&sorted[below]<s) below++;
  return below/Math.max(1,sorted.length-1);
}
function roomFit(item, players=S.players){
  const fs=players.filter(p=>p.answers).map(p=>fitOf(item,p.answers));
  if(!item||!item.tags||!fs.length) return null;
  const avg=fs.reduce((s,f)=>s+f,0)/fs.length, min=Math.min(...fs);
  const happy=fs.filter(f=>f>=HAPPY).length, miserable=fs.filter(f=>f<DEALBREAK).length;
  const score=Math.max(0, .55*avg + .45*min - .06*miserable);
  return {score, avg, min, happy, miserable, n:fs.length};
}
const roomPct = r => Math.max(5,Math.min(99,Math.round(100*r.score/.8)));   /* .8 is about as good as a real room gets */
const groupScore = id => { const r=BY_ID[id]&&roomFit(BY_ID[id]); return r ? r.score : 0; };
/* The room's ranking of every title that fits the audience, best first. */
function roomRanking(){ return CATALOG.filter(fits).map(c=>({c,r:roomFit(c)})).filter(x=>x.r).sort((a,b)=>b.r.score-a.r.score); }
function roomLabel(r){
  if(!r||r.n<2) return '';
  if(!r.miserable && r.min>=.4) return 'Works for everyone';
  if(!r.miserable) return r.happy>=Math.ceil(r.n/2) ? 'Good for most of the room' : 'Nobody’s against it';
  return r.miserable===1 ? 'Risky: 1 of you would rather skip it' : `Risky: ${r.miserable} of you would rather skip it`;
}
/* Plain-language reason a title suits this room. Counts people, never names them, so ballots stay secret. */
function roomWhy(item, players=S.players){
  const ps=players.filter(p=>p.answers); if(!item||!item.tags||!ps.length) return '';
  const n=ps.length, r=roomFit(item,ps), bits=[];
  const wants={}; ps.forEach(p=>{ if(tagWeight(item,p.answers.want)>0) wants[p.answers.want]=(wants[p.answers.want]||0)+1; });
  const hit=Object.values(wants).reduce((s,x)=>s+x,0);
  const words=Object.keys(wants).sort((a,b)=>wants[b]-wants[a]).map(w=>WANT_WORD[w]);
  if(hit) bits.push(`${hit===n?(n===2?'Both of you':`All ${n} of you`):hit+' of '+n} get what you asked for (${words.slice(0,2).join(' and ')})`);
  const vibe={}; ps.forEach(p=>{ const v=p.answers.vibe, rg=VIBE_RANGE[v]; if(rg&&item.i>=rg[0]&&item.i<=rg[1]) vibe[v]=(vibe[v]||0)+1; });
  const topV=Object.entries(vibe).sort((a,b)=>b[1]-a[1])[0];
  if(topV&&topV[1]>=2) bits.push(`the right weight for the ${topV[1]} of you who are ${VIBE_WORD[topV[0]]}`);
  else if(topV&&n<=2) bits.push(`the right weight for how you feel`);
  const fans=ps.filter(p=>ACTORS[p.answers.actor]&&item.cast.includes(ACTORS[p.answers.actor].n)).map(p=>ACTORS[p.answers.actor].n);
  if(fans.length) bits.push(`stars ${[...new Set(fans)][0]}, a hangout pick`);
  let line = bits.length ? bits.slice(0,2).join(', and ')+'.' : 'A compromise pick: nobody’s first choice, but it splits the difference.';
  line = line.charAt(0).toUpperCase()+line.slice(1);
  if(r&&n>1){ line += r.miserable ? ` Heads up: ${r.miserable===1?'one of you is':r.miserable+' of you are'} hoping for something different.` : r.min>=.4 ? ' Nobody gets stuck with it.' : ''; }
  return line;
}
function whyLine(item,a){
  const p=scoreParts(item,a), bits=[], act=ACTORS[a.actor];
  if(item.unverified) return 'New on Angel. We\u2019ll know more about this one soon.';
  if (act && item.cast.includes(act.n)) bits.push('stars '+act.n+', your hangout pick');
  const MAIN={funny:'made to make you laugh',cry:'built for a good cry',thrill:'gets your pulse up',learn:'teaches you something real',inspire:'built to lift you up',adventure:'takes you somewhere else'};
  const SOME={funny:'has real laughs in it',cry:'will get you misty',thrill:'has real tension',learn:'teaches you something along the way',inspire:'leaves you lifted',adventure:'has a sense of escape'};
  if (p.want>=4) bits.push(MAIN[a.want]); else if (p.want>0) bits.push(SOME[a.want]);
  if (p.genre) bits.push('matches your genre pick');
  if (p.feel>0) bits.push(item.i<=2?'light enough for how you feel':'the right weight for your mood');
  if (a.len==='short' && item.len==='short') bits.push('fits a short window');
  return bits.length ? 'Why: '+bits.slice(0,3).join(', ')+'.' : 'A wildcard. Not a close match, but worth a look.';
}
function roomRead(){
  const ps=S.players.filter(p=>p.answers); if(!ps.length) return '';
  const top=(k)=>{const c={}; ps.forEach(p=>c[p.answers[k]]=(c[p.answers[k]]||0)+1); return Object.entries(c).sort((a,b)=>b[1]-a[1])[0];};
  const [w,wn]=top('want'), [v,vn]=top('vibe');
  const best=ps.length>1?roomRanking()[0]:null;
  return `Room read: ${wn} of ${ps.length} want to ${WANT_WORD[w]}. ${vn>1?vn+' of you are':'One of you is'} ${VIBE_WORD[v]}.${best?` Best bet for everyone so far: ${best.c.t}.`:''}`;
}

}
function leave(){ S.unsubs.forEach(u=>u()); S.unsubs=[]; S.code=null; S.game=null; S.players=[]; lsSet('wswt-session',null);
  Object.assign(S.ui,{screen:'home',qi:0,ans:{genres:[]},deck:0,passed:[],custom:'',voted:{}}); render(); }

/* ---------- host logic ---------- */
const allDone = k => S.players.length>0 && S.players.every(p=>p.done&&p.done[k]);
function hostTick(){
  const g=S.game; if(!g||S.host.busy) return;
  if(g.stage==='mood' && allDone('mood')) return hostWrite({stage:'nominate'});
  if(g.stage==='nominate' && allDone('nominate')) return hostWrite(buildBracket());
  if(g.stage==='bracket' && !g.pending){
    const key=curKey(); if(S.players.every(p=>p.votes&&p.votes[key])) resolveMatch();
  }
  runBots();
}
async function hostWrite(data){ S.host.busy=true; try{ await write(gamePath(),'update',data); } finally { S.host.busy=false; } }

function buildBracket(){
  const entries={};
  S.players.forEach(p=>{
    (p.noms||[]).forEach(id=>{ const c=BY_ID[id]; if(!c||!fits(c)) return; entries[id]=entries[id]||{id,t:c.t,y:c.y,k:c.k,age:c.age,by:[]}; entries[id].by.push(p.name); });
    (p.customs||[]).forEach(c=>{ entries[c.id]=entries[c.id]||{id:c.id,t:c.t,custom:true,by:[]}; if(!entries[c.id].by.includes(p.name)) entries[c.id].by.push(p.name); });
  });
  const rank=id=>{ const r=BY_ID[id]&&roomFit(BY_ID[id]); return entries[id].by.length*4 + (r?12*r.score-3*r.miserable:0) + (entries[id].custom?3:0); };
  let ids=Object.keys(entries).sort((a,b)=>rank(b)-rank(a));
  const size = ids.length<=4 ? 4 : 8;
  ids=ids.slice(0,size);
  const wild=CATALOG.filter(fits).map(c=>c.id).filter(id=>!entries[id]).sort((a,b)=>groupScore(b)-groupScore(a));
  if(!wild.length) wild.push(...CATALOG.filter(c=>c.age==='all').map(c=>c.id).filter(id=>!entries[id]));
  while(ids.length<size){ const id=wild.shift(); const c=BY_ID[id]; entries[id]={id,t:c.t,y:c.y,k:c.k,age:c.age,by:[],wild:true}; ids.push(id); }
  const order = size===8 ? [0,7,3,4,1,6,2,5] : [0,3,1,2];
  return {stage:'bracket', entries, rounds:[order.map(i=>ids[i])], cur:{r:0,m:0}, pending:false, lastResult:null};
}
const curKey = () => S.game&&S.game.cur ? `r${S.game.cur.r}m${S.game.cur.m}` : '';
function matchup(){ const g=S.game, {r,m}=g.cur; return [g.rounds[r][2*m], g.rounds[r][2*m+1]]; }
function tally(key,pair){ const t={[pair[0]]:0,[pair[1]]:0}; S.players.forEach(p=>{ const v=p.votes&&p.votes[key]; if(v in t) t[v]++; }); return t; }
async function resolveMatch(){
  const g=S.game, key=curKey(), pair=matchup(), t=tally(key,pair);
  let w = t[pair[0]]>t[pair[1]] ? pair[0] : t[pair[1]]>t[pair[0]] ? pair[1] : null;
  let tie=false;
  if(!w){ tie=true; const a=10*groupScore(pair[0])+.1*g.entries[pair[0]].by.length, b=10*groupScore(pair[1])+.1*g.entries[pair[1]].by.length; w = a===b ? pair[Math.random()<.5?0:1] : (a>b?pair[0]:pair[1]); }
  await hostWrite({pending:true, lastResult:{key, winner:w, tally:t, tie}});
  setTimeout(()=>advance(w), 2200);
}
async function advance(w){
  const g=clone(S.game); if(!g||g.stage!=='bracket') return;
  const {r,m}=g.cur; const rounds=g.rounds;
  rounds[r+1]=rounds[r+1]||[]; rounds[r+1][m]=w;
  let cur;
  if(m+1 < rounds[r].length/2) cur={r,m:m+1};
  else if(rounds[r+1].length===1){ await hostWrite({rounds, stage:'winner', winner:w, pending:false}); return; }
  else cur={r:r+1,m:0};
  await hostWrite({rounds, cur, pending:false, lastResult:null});
}
async function forceAdvance(){
  const g=S.game; if(!g) return;
  if(g.stage==='mood') hostWrite({stage:'nominate'});
  else if(g.stage==='nominate') hostWrite(buildBracket());
  else if(g.stage==='bracket' && !g.pending) resolveMatch();
}

/* bots: host-driven test friends */
async function addBot(){
  S.host.botNames=S.host.botNames||new Set();
  const used=new Set([...S.players.map(p=>p.name),...S.host.botNames]); const name=BOT_NAMES.find(n=>!used.has(n))||('Guest '+(used.size+1));
  S.host.botNames.add(name);
  const id='bot-'+rid(6);
  await write(gamePath()+'/players/'+id,'set',{name, bot:true, joinedAt:Date.now(), done:{}, votes:{}, noms:[], customs:[]});
}
function botOnce(key, ms, fn){ if(S.host.botTimers.has(key)) return; S.host.botTimers.add(key); setTimeout(fn, ms); }
function runBots(){
  const g=S.game; if(!g) return;
  S.players.filter(p=>p.bot).forEach(b=>{
    const path=gamePath()+'/players/'+b.id, wait=800+Math.random()*2200;
    if(g.stage==='mood' && !b.done?.mood) botOnce(b.id+':mood', wait, ()=>{
      const qk=k=>Q.find(q=>q.key===k), pick=k=>{const o=qk(k).opts; return o[Math.floor(Math.random()*o.length)][0];};
      const genres=[pick('genres')]; if(Math.random()<.5) genres.push(pick('genres'));
      write(path,'update',{answers:{vibe:pick('vibe'),want:pick('want'),len:pick('len'),actor:pick('actor'),snack:pick('snack'),drink:pick('drink'),playlist:pick('playlist'),genres:[...new Set(genres)]}, done:{mood:true}});
    });
    if(g.stage==='nominate' && !b.done?.nominate) botOnce(b.id+':nom', wait+800, ()=>{
      const s=suggestionsFor(b.answers).slice(0,4).sort(()=>Math.random()-.5).slice(0,2).map(c=>c.id);
      write(path,'update',{noms:s, done:{nominate:true}});
    });
    if(g.stage==='bracket' && !g.pending){ const key=curKey(); if(!b.votes?.[key]) botOnce(b.id+':'+key, wait, ()=>{
      if(!S.game||curKey()!==key) return;
      const [a,c]=matchup(); const sa=BY_ID[a]?score(BY_ID[a],b.answers):3, sc=BY_ID[c]?score(BY_ID[c],b.answers):3;
      const pa = 1/(1+Math.exp(-(sa-sc)*.6));
      write(path,'update',{votes:{[key]: Math.random()<pa ? a : c}});
    }); }
  });
}

function fmtQty(q){
  if(q==null) return '';
  const whole=Math.floor(q+1e-9), f=q-whole;
  const fr=[[.25,'¼'],[.33,'⅓'],[.5,'½'],[.67,'⅔'],[.75,'¾']].find(([v])=>Math.abs(f-v)<.06);
  if(f<.06) return String(whole);
  if(fr) return (whole?whole+' ':'')+fr[1];
  return (Math.round(q*10)/10).toString();
}

/* Scoring: +3 per bracket win by your nominee, +5 if it takes the night, +1 per correct call */
function standings(){
  const g=S.game, T=g.rounds.length-1;
  const wins=id=>{ let w=0; for(let r=1;r<g.rounds.length;r++) if((g.rounds[r]||[]).includes(id)) w++; return w; };
  const matches=[]; for(let r=0;r<T;r++) (g.rounds[r+1]||[]).forEach((w,m)=>matches.push({key:`r${r}m${m}`,w}));
  const reach=(w)=> w===T?'Won the night':w===T-1?'Made the final':(T===3&&w===1)?'Made the semis':'Out in round one';
  const rows=S.players.map(p=>{
    const mine=[...(p.noms||[]),...(p.customs||[]).map(c=>c.id)].filter(id=>g.entries[id]&&g.rounds[0].includes(id));
    const best=mine.map(id=>({id,w:wins(id)})).sort((a,b)=>b.w-a.w)[0]||null;
    const nomPts=mine.reduce((s,id)=>s+3*wins(id)+(id===g.winner?5:0),0);
    const calls=matches.filter(x=>p.votes&&p.votes[x.key]===x.w).length;
    const contrary=matches.filter(x=>p.votes&&p.votes[x.key]&&p.votes[x.key]!==x.w).length;
    const writeInFar=(p.customs||[]).some(c=>g.rounds[0].includes(c.id)&&wins(c.id)>=T-1);
    return {p,best,calls,contrary,writeInFar,pts:nomPts+calls,missed:(p.noms||[]).length+(p.customs||[]).length>mine.length};
  }).sort((a,b)=>b.pts-a.pts||b.calls-a.calls||(b.best?b.best.w:-1)-(a.best?a.best.w:-1));
  return {rows,total:matches.length,reach,T};
}

const BADGE_ORDER=['mogul','tastemaker','perfect','oracle','writein','rebel','contender','sport'];
function badgesFor(st){
  const g=S.game, {rows,total}=st, out=new Map(rows.map(r=>[r.p.id,[]]));
  const add=(r,k)=>out.get(r.p.id).push(k);
  const topPts=rows[0]?rows[0].pts:0, secondPts=Math.max(0,...rows.map(r=>r.pts).filter(p=>p<topPts)), maxCalls=Math.max(0,...rows.map(r=>r.calls)), maxCon=Math.max(0,...rows.map(r=>r.contrary));
  rows.forEach(r=>{
    if(topPts>0 && r.pts===topPts) add(r,'mogul');
    if(r.best && r.best.id===g.winner) add(r,'tastemaker');
    if(total && r.calls===total) add(r,'perfect'); else if(maxCalls>0 && r.calls===maxCalls) add(r,'oracle');
    if(r.writeInFar) add(r,'writein');
    if(maxCon>=2 && r.contrary===maxCon) add(r,'rebel');
    if(!out.get(r.p.id).length && secondPts>0 && r.pts===secondPts) add(r,'contender');
    if(!out.get(r.p.id).length) add(r,'sport');
    out.set(r.p.id, out.get(r.p.id).sort((a,b)=>BADGE_ORDER.indexOf(a)-BADGE_ORDER.indexOf(b)));
  });
  return out;
}

    const copied=await copyText(captionFor(k,x,false)+'\n'+SHARE_URL);
    const saved=await saveBadge(k,x);
    toast(saved ? `Image saved${copied?' and caption copied':''}. Open ${net} and post it.` : (copied?`Caption copied. Save the image, then post it on ${net}.`:`Save the image, then post it on ${net}.`));
  }
}

/* ---------- swipe: drag the card right to nominate, left to pass ---------- */
function wireSwipe(){
  const card=document.getElementById('swipecard'); if(!card) return;
  let x0=0, y0=0, dx=0, id=null, horiz=null;
  const yes=card.querySelector('.stamp.yes'), no=card.querySelector('.stamp.no');
  const paint=()=>{ card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; yes.style.opacity=Math.max(0,Math.min(1,dx/90)); no.style.opacity=Math.max(0,Math.min(1,-dx/90)); };
  const end=commit=>{
    S.ui.dragging=false; card.classList.remove('drag');
    if(commit){ const dir=commit; card.style.transition='transform .22s ease-in'; card.style.transform=`translateX(${dir*innerWidth}px) rotate(${dir*24}deg)`;
      setTimeout(()=>{ S.ui.pendingRender=false; dir>0 ? nominate(card.dataset.id) : (S.ui.deck++, render()); },200); }
    else { card.style.transition='transform .2s ease-out'; dx=0; paint(); if(S.ui.pendingRender){ S.ui.pendingRender=false; setTimeout(render,210); } }
  };
  card.addEventListener('pointerdown',e=>{ if(e.button>0) return; id=e.pointerId; x0=e.clientX; y0=e.clientY; dx=0; horiz=null; card.style.transition='none'; });
  card.addEventListener('pointermove',e=>{
    if(e.pointerId!==id) return;
    const mx=e.clientX-x0, my=e.clientY-y0;
    if(horiz===null && Math.abs(mx)+Math.abs(my)>8){ horiz=Math.abs(mx)>Math.abs(my); if(horiz){ card.setPointerCapture(id); S.ui.dragging=true; card.classList.add('drag'); } }
    if(horiz){ dx=mx; paint(); }
  });
  const up=e=>{ if(e.pointerId!==id) return; id=null; if(!horiz) return; end(dx>110?1:dx<-110?-1:0); };
  card.addEventListener('pointerup',up); card.addEventListener('pointercancel',up);
  card.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){ e.preventDefault(); end(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); end(-1); } });
}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#fx'), x=c.getContext('2d'); c.hidden=false;
  const W=c.width=innerWidth*devicePixelRatio, H=c.height=innerHeight*devicePixelRatio;
  const cols=['#FFC145','#FF6F59','#5CE1B0','#9CB8FF','#F4F0FF'];
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-Math.random()*H*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*5,s:(4+Math.random()*7)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){ x.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy*devicePixelRatio; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(t-t0<3500) requestAnimationFrame(f); else { x.clearRect(0,0,W,H); c.hidden=true; } })(t0);
}

/* ---------- boot ---------- */
(function boot(){
  let local=lsGet('wswt-pid'); if(!local){ local='p-'+rid(10); lsSet('wswt-pid',local); }
  S.me.id=local;
  render();
  loadLineup();
  if(!window.claude||!window.claude.use) return;
  window.claude.use('downloads').then(d=>{ S.dl=d; }).catch(()=>{});
  window.claude.use('assets').then(a=>{ S.assets=a; render(); }).catch(()=>{});
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(async ([db,user])=>{
    if(!db) return;
    let uid=null; try{ uid = user ? await user.id() : null; }catch{}
    if(uid && /^[A-Za-z0-9_\-.~:@+]{1,180}$/.test(uid)){ S.me.id=uid; S.uidOk=true; }
    if(S.code){ watchArtFrom(db); return; } // already playing locally; keep that game
    S.db=db; S.mode='live'; watchArt(); render();
    const sess=lsGet('wswt-session');
    if(sess&&sess.mode==='live'&&sess.code){
      const g=await db.doc('games/'+sess.code).get().catch(()=>null);
      const me=g&&g.exists ? await db.doc('games/'+sess.code+'/players/'+S.me.id).get().catch(()=>null) : null;
      if(me&&me.exists&&!S.code) subscribe(sess.code);
    }
  }).catch(()=>{});
})();
